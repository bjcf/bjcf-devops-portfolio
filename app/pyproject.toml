[project]
name = "bjcf-devops-portfolio-api"
version = "0.1.0"
description = "Sample workload for a cloud-native DevOps portfolio"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
