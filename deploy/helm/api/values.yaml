replicaCount: 2

image:
  repository: ghcr.io/bjcf/bjcf-devops-portfolio
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

# Hardened pod/container security context (non-root, read-only rootfs).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Emit a ServiceMonitor for the Prometheus Operator (kube-prometheus-stack).
serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics

env:
  LOG_LEVEL: INFO

nodeSelector: {}
tolerations: []
affinity: {}
